$mainMod = SUPER

# NVIDIA dGPU (card1) primary - avoids cross-GPU frame copy for the TV (HDMI-A-1),
# which is wired to it. Intel iGPU (card2) still listed since eDP-1 (laptop panel)
# needs it available as a fallback. Trades battery life/heat for lower latency.
env = AQ_DRM_DEVICES,/dev/dri/card1:/dev/dri/card2

# open G-Hyprland script
# windowrule = float on, match:title ^(G-Hyprland)$
bind = $mainMod, S, exec, footclient -w 750x600 -T G-Hyprland -e ~/.config/hypr/brain/brain.sh
# disable G-hyprland
bind = $mainMod SHIFT, G, exec, footclient -e ~/.local/bin/bear/implement_gum.sh disable

