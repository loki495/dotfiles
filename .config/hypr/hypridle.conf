general {
    # wlopm (not `hyprctl dispatch dpms`) -- the DRM-level dpms dispatch is
    # misread by the NVIDIA driver as a physical monitor disconnect on this
    # hybrid Intel/NVIDIA setup, causing a backlit-but-blank/unresponsive
    # screen on wake. wlopm uses the proper wlr-output-power-management-v1
    # protocol instead. See hyprwm/Hyprland discussions #14234, #12583.
    after_sleep_cmd = wlopm --on '*' # screen on after sleep
}

# turn off screen and keyboard backlight after 2.5 minutes of inactivity
listener {
    timeout = 150                                # 2.5min.
    # Backlight to literal 0 (not just dim) -- this panel is a standard LCD
    # (Chimei Innolux), not OLED, so there's no burn-in concern; confirmed
    # live 2026-08-19 that 0 actually looks off, vs. the old dim-only value
    # (10) which still looked visibly bright. Pure backlight/sysfs control,
    # completely separate from DRM connector state, so unlike the removed
    # DPMS-off listener this can NEVER trigger the cross-GPU blit hang (see
    # note below) no matter how it's timed.
    #
    # Guarded: `-s set 0` unconditionally saves-then-dims. If on-timeout
    # ever fires twice without an intervening on-resume (a missed/raced
    # resume event), the second save would clobber the restore slot with
    # the already-dimmed value (0), permanently locking the screen off --
    # confirmed live 2026-08-17 with the old dim value (10), hyprctl/
    # compositor otherwise fully healthy. Only save when clearly not
    # already dimmed.
    on-timeout = [ "$(brightnessctl g)" -gt 100 ] && brightnessctl -s set 0 || brightnessctl set 0
    on-resume = brightnessctl -r                 # monitor backlight restore.
}

listener {
    timeout = 150                                          # 2.5min.
    on-timeout = brightnessctl -sd rgb:kbd_backlight set 0 # turn off keyboard backlight.
    on-resume = brightnessctl -rd rgb:kbd_backlight        # turn on keyboard backlight.
}

# Note: no full DPMS-off listener here anymore. Disabling the eDP-1 output
# (via wlopm or hyprctl dispatch dpms) forces Aquamarine to re-init a
# cross-GPU blit on wake (NVIDIA-rendered frame -> Intel, since eDP-1 is
# wired to the iGPU while AQ_DRM_DEVICES forces NVIDIA primary for the TV),
# and that re-init intermittently fails with EGL_BAD_MATCH on
# eglCreateImageKHR, leaving the panel backlit-but-black and unresponsive
# (confirmed live via hyprland.log + systemd-coredump, 2026-08-16/17). The
# 2.5min brightness-dimming listener above doesn't touch the DRM connector at
# all, so it can't trigger this -- screen just stays dimmed until real
# suspend at 30min instead of fully blanking at 5min.

# -------------------------------
# Suspend after 30 minutes (waits for any active Claude Code session to
# finish first -- see scripts/suspend-when-idle.sh)
# -------------------------------
listener {
    timeout = 1800                           # 30min.
    on-timeout = loginctl lock-session && $HOME/.config/hypr/scripts/suspend-when-idle.sh
    on-resume = pkill -f suspend-when-idle.sh
}

