services:
  traefik:
    image: traefik:v3.6.5
    container_name: traefik
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      # File provider - used for the dynamic/*.yml routes (media sites,
      # the LAN apex redirect, the *.ac495.net router table). Docker labels
      # alone can only reference dynamic config attributes, not embed a real
      # certificate file, which is why this used to also carry a one-off
      # self-signed TLS cert for csm/sessioneer (removed once the real
      # *.ac495.net wildcard cert below made it redundant).
      - "--providers.file.directory=/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      # Added specifically so sessioneer can be served over
      # HTTPS (a secure context is a hard requirement for Service
      # Workers/Web Push, not optional - plain HTTP silently blocks
      # navigator.serviceWorker entirely, no error surfaced). Purely
      # additive: doesn't affect any existing HTTP-only router on other
      # sites sharing this Traefik instance.
      - "--entrypoints.websecure.address=:443"
      - "--log.level=INFO"
      - "--api.insecure=true"
      # LAN HTTPS for *.${TRAEFIK_DOMAIN}: a wildcard cert issued via Let's
      # Encrypt's DNS-01 challenge against Cloudflare's API (CF_DNS_API_TOKEN
      # below), since these names are never reachable on :80 from the public
      # internet for an HTTP-01 challenge. Requesting it as the entrypoint's
      # default cert (rather than per-router) means every current and future
      # *.${TRAEFIK_DOMAIN} router gets it automatically, including
      # sessioneer.${TRAEFIK_DOMAIN} - which is why the old one-off
      # self-signed cert for csm/sessioneer was removed rather than kept
      # alongside this.
      - "--certificatesresolvers.cloudflare.acme.dnschallenge=true"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.cloudflare.acme.email=${TRAEFIK_EMAIL}"
      - "--certificatesresolvers.cloudflare.acme.storage=/etc/traefik/acme/acme.json"
      - "--entrypoints.websecure.http.tls.certresolver=cloudflare"
      - "--entrypoints.websecure.http.tls.domains[0].main=${TRAEFIK_DOMAIN}"
      - "--entrypoints.websecure.http.tls.domains[0].sans=*.${TRAEFIK_DOMAIN}"
    env_file:
      - .env
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./dynamic:/dynamic:ro"
      - "./acme:/etc/traefik/acme"

networks:
  default:
    name: web
