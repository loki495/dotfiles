    # Media server sites (LAN HTTPS only -- remote/tunnel access still goes
    # directly from cloudflared on media to localhost:<port>, bypassing
    # Traefik entirely; this router exists purely so LAN clients get the
    # same wildcard cert via Pi-hole pointing these names at 10.10.0.10
    # instead of 10.10.0.20).
    sonarr-ac495:
      entryPoints: [websecure]
      rule: Host(`sonarr.example.com`)
      service: sonarr-media
    radarr-ac495:
      entryPoints: [websecure]
      rule: Host(`radarr.example.com`)
      service: radarr-media
    prowlarr-ac495:
      entryPoints: [websecure]
      rule: Host(`prowlarr.example.com`)
      service: prowlarr-media
    jackett-ac495:
      entryPoints: [websecure]
      rule: Host(`jackett.example.com`)
      service: jackett-media
    nzbget-ac495:
      entryPoints: [websecure]
      rule: Host(`nzbget.example.com`)
      service: nzbget-media
    bazarr-ac495:
      entryPoints: [websecure]
      rule: Host(`bazarr.example.com`)
      service: bazarr-media
    qbittorrent-ac495:
      entryPoints: [websecure]
      rule: Host(`qbittorrent.example.com`)
      service: qbittorrent-media
    esphome-ac495:
      entryPoints: [websecure]
      rule: Host(`esphome.example.com`)
      service: esphome-media
    homeassistant-ac495:
      entryPoints: [websecure]
      rule: Host(`homeassistant.example.com`)
      service: homeassistant-media
    status-ac495:
      entryPoints: [websecure]
      rule: Host(`status.example.com`)
      service: status-media
    stocks-ac495:
      entryPoints: [websecure]
      rule: Host(`stocks.example.com`)
      service: stocks-media
    pihole-ac495:
      entryPoints: [websecure]
      rule: Host(`pihole.example.com`)
      service: pihole-media
    hyperion-ac495:
      entryPoints: [websecure]
      rule: Host(`hyperion.example.com`)
      service: hyperion-media
    claude-ui-ac495:
      entryPoints: [websecure]
      rule: Host(`claude-ui.example.com`)
      service: claude-ui-media
    lazydocker-ac495:
      entryPoints: [websecure]
      rule: Host(`lazydocker.example.com`)
      service: lazydocker-media

  services:
    sonarr-media:
      loadBalancer:
        servers:
          - url: "http://10.10.0.20:8989"
