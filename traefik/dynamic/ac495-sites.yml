      service: termui@docker

    # Media server sites (LAN HTTPS only -- remote/tunnel access still goes
    # directly from cloudflared on media to localhost:<port>, bypassing
    # Traefik entirely; this router exists purely so LAN clients get the
    # same wildcard cert via Pi-hole pointing these names at the LAN host
    # running Traefik instead of the media box directly).
    bazarr-ac495:
      entryPoints: [websecure]
      rule: Host(`bazarr.{{ env "TRAEFIK_DOMAIN" }}`)
      service: bazarr-media
    claude-ui-ac495:
      entryPoints: [websecure]
      rule: Host(`claude-ui.{{ env "TRAEFIK_DOMAIN" }}`)
      service: claude-ui-media
    esphome-ac495:
      entryPoints: [websecure]
      rule: Host(`esphome.{{ env "TRAEFIK_DOMAIN" }}`)
      service: esphome-media
    homeassistant-ac495:
      entryPoints: [websecure]
      rule: Host(`homeassistant.{{ env "TRAEFIK_DOMAIN" }}`)
      service: homeassistant-media
    hyperion-ac495:
      entryPoints: [websecure]
      rule: Host(`hyperion.{{ env "TRAEFIK_DOMAIN" }}`)
      service: hyperion-media
    jackett-ac495:
      entryPoints: [websecure]
      rule: Host(`jackett.{{ env "TRAEFIK_DOMAIN" }}`)
      service: jackett-media
    lazydocker-ac495:
      entryPoints: [websecure]
      rule: Host(`lazydocker.{{ env "TRAEFIK_DOMAIN" }}`)
      service: lazydocker-media
    nzbget-ac495:
      entryPoints: [websecure]
      rule: Host(`nzbget.{{ env "TRAEFIK_DOMAIN" }}`)
      service: nzbget-media
    pihole-ac495:
      entryPoints: [websecure]
      rule: Host(`pihole.{{ env "TRAEFIK_DOMAIN" }}`)
      service: pihole-media
    prowlarr-ac495:
      entryPoints: [websecure]
      rule: Host(`prowlarr.{{ env "TRAEFIK_DOMAIN" }}`)
      service: prowlarr-media
    qbittorrent-ac495:
      entryPoints: [websecure]
      rule: Host(`qbittorrent.{{ env "TRAEFIK_DOMAIN" }}`)
      service: qbittorrent-media
    radarr-ac495:
      entryPoints: [websecure]
      rule: Host(`radarr.{{ env "TRAEFIK_DOMAIN" }}`)
      service: radarr-media
    sonarr-ac495:
      entryPoints: [websecure]
      rule: Host(`sonarr.{{ env "TRAEFIK_DOMAIN" }}`)
      service: sonarr-media
    status-ac495:
      entryPoints: [websecure]
      rule: Host(`status.{{ env "TRAEFIK_DOMAIN" }}`)
      service: status-media
    stocks-ac495:
      entryPoints: [websecure]
      rule: Host(`stocks.{{ env "TRAEFIK_DOMAIN" }}`)
      service: stocks-media

    # LAN-only: redirect the bare apex to homie. Public/Cloudflare-side
    # traffic to the apex is handled separately by a Cloudflare Redirect
    # Rule (github.com/loki495), since Pi-hole resolves the apex straight
    # to this host for LAN clients, bypassing Cloudflare entirely.
    ac495-apex-redirect:
      entryPoints: [web, websecure]
      rule: Host(`{{ env "TRAEFIK_DOMAIN" }}`)
      middlewares: [apex-to-homie]
      service: homie@docker

  middlewares:
    apex-to-homie:
      redirectRegex:
        regex: '^https?://{{ env "TRAEFIK_DOMAIN" }}/(.*)'
        replacement: 'https://homie.{{ env "TRAEFIK_DOMAIN" }}/${1}'
        permanent: true

  services:
    bazarr-media:
      loadBalancer:
        servers:
          - url: 'http://{{ env "TRAEFIK_MEDIA_HOST" }}:6767'
    claude-ui-media:
      loadBalancer:
        servers:
          - url: 'http://{{ env "TRAEFIK_WORK_HOST" }}:3001'
    esphome-media:
      loadBalancer:
        servers:
          - url: 'http://{{ env "TRAEFIK_MEDIA_HOST" }}:6052'
    homeassistant-media:
      loadBalancer:
        servers:
          - url: 'http://{{ env "TRAEFIK_MEDIA_HOST" }}:8123'
    hyperion-media:
      loadBalancer:
        servers:
          - url: 'http://{{ env "TRAEFIK_RPI_HOST" }}:8090'
    jackett-media:
      loadBalancer:
        servers:
          - url: 'http://{{ env "TRAEFIK_MEDIA_HOST" }}:9117'
    lazydocker-media:
      loadBalancer:
        servers:
          - url: 'http://{{ env "TRAEFIK_MEDIA_HOST" }}:3333'
    nzbget-media:
      loadBalancer:
        servers:
          - url: 'http://{{ env "TRAEFIK_MEDIA_HOST" }}:6789'
    pihole-media:
      loadBalancer:
        servers:
          - url: 'http://{{ env "TRAEFIK_MEDIA_HOST" }}:8001'
    prowlarr-media:
      loadBalancer:
        servers:
          - url: 'http://{{ env "TRAEFIK_MEDIA_HOST" }}:9696'
    qbittorrent-media:
      loadBalancer:
        servers:
          - url: 'http://{{ env "TRAEFIK_MEDIA_HOST" }}:8080'
    radarr-media:
      loadBalancer:
        servers:
          - url: 'http://{{ env "TRAEFIK_MEDIA_HOST" }}:7878'
    sonarr-media:
      loadBalancer:
        servers:
          - url: 'http://{{ env "TRAEFIK_MEDIA_HOST" }}:8989'
    status-media:
      loadBalancer:
        servers:
          - url: 'http://{{ env "TRAEFIK_MEDIA_HOST" }}:8081'
    stocks-media:
      loadBalancer:
        servers:
          - url: 'http://{{ env "TRAEFIK_MEDIA_HOST" }}:8085'
