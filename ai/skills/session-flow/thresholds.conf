# Session flow thresholds: the single source for every continue, park, rotate and cleanup decision.
# Shell-sourceable (hooks read it); skill session-flow explains the states. Environment variables of
# the same name (or the CLAUDE_CTX_* names the context-budget hook has always taken) override a value.
# Quota values are percentages of a profile's `session` and `week_all` as `sessioneer --usage` reports them.

# GO: context below CTX_GO_MAX tokens, cache warm, quota below QUOTA_GO_MAX: continue here.
CTX_GO_MAX=150000
QUOTA_GO_MAX=80

# WARM TIGHT: context from CTX_GO_MAX to CTX_ROTATE, or quota from QUOTA_GO_MAX to QUOTA_PARK:
# finish the step, then CHECKPOINT. At CTX_ROTATE or more the context-budget hook warns every prompt.
CTX_ROTATE=250000

# PARK: quota at QUOTA_PARK or more and no other agent or profile has room.
QUOTA_PARK=90

# Questions are asked before a handoff while quota is below QUOTA_CARRY; at or above it they are
# carried in the handoff and asked by the receiver.
QUOTA_CARRY=95

# Cache: the prompt cache lasts about IDLE_MIN minutes; an idle session with at least IDLE_FLOOR
# tokens of context would rewrite all of it, so the hook blocks the prompt once.
IDLE_MIN=60
IDLE_FLOOR=100000
