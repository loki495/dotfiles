[mcp_servers.dibs]
command = "sh"
args = ["-c", "exec docker compose -f $HOME/www/personal/dibs/docker-compose.yml exec -T -u www-data -e DIBS_CLIENT_PID=$PPID app php artisan mcp:start todo"]

# The Linux sandbox's seccomp filter denies connect() for every socket family,
# AF_UNIX included, while network is off, so sessioneer --peers/--send/--usage
# could not reach the host agent socket from a workspace-write session.
[sandbox_workspace_write]
network_access = true
