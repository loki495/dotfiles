# Curator settings (KEY=VALUE). Unknown keys are ignored; a bad number is a configuration error.
# A session or a file under ACTIVITY_PATHS touched within ACTIVE_MIN minutes blocks a run.
ACTIVE_MIN=30
ACTIVITY_PATHS=~/.claude/projects:~/.claude-work/projects:~/.codex/sessions
# Before a run, one tiny call with this model reads the live quota of each candidate profile.
PROBE_MODEL=claude-haiku-5-5
PROBE_TIMEOUT_SEC=90
HEARTBEAT_SEC=600
LOG_DAYS=14
LOG_KEEP=200
DIBS_AREA=2
DIBS_GROUP=AI workflows
# Read/Grep/Glob paths in a pass's Tools header must be under one of these directories (colon separated).
TOOL_PATHS=~/www:~/dotfiles
